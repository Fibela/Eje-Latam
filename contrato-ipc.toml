# Contrato IPC entre Eje-Visión y Eje-Agente.
#
# RPT-006. PA-20.
#
# ---------------------------------------------------------------------------
# POR QUE EXISTE ESTE FICHERO
# ---------------------------------------------------------------------------
#
# Rust y TypeScript no pueden compartir una definicion de tipos. Si cada lado
# declara los canales por su cuenta, divergen: es exactamente lo que ocurrio en
# este proyecto, donde `eje-vision` tenia su lista de canales y `eje-agente` no
# tenia ninguna.
#
# Este manifiesto es la UNICA FUENTE DE VERDAD. Ambos lados incluyen una prueba
# que lo lee y falla si su definicion local no coincide. La divergencia deja de
# ser posible en silencio: se convierte en CI en rojo.
#
# Es el mismo mecanismo que FUENTES.toml con su anclaje: declaracion unica mas
# comprobacion ejecutable en cada extremo.
#
# ---------------------------------------------------------------------------
# ANADIR UN CANAL
# ---------------------------------------------------------------------------
#
# Requiere tocar TRES sitios, y esa friccion es deliberada:
#   1. este fichero
#   2. `crates/eje-ipc/src/lib.rs`  (enum Canal)
#   3. `apps/eje-vision/packages/eje-vision-base/src/ipc/puente.ts`
#
# Un canal es una ampliacion de la superficie de ataque del proceso privilegiado.
# No debe poder anadirse sin que tres revisiones lo vean.

# ---------------------------------------------------------------------------
# FORMA DE LA PETICION Y DE LA RESPUESTA — RPT-035, PA-41
# ---------------------------------------------------------------------------
#
# Este bloque faltaba. El manifiesto declaraba QUE canales existen y QUE campos
# lleva cada carga, pero no COMO viaja el nombre del canal por el cable. Mientras
# no hubo transporte no se noto; al escribir el servicio, cada extremo habria
# tenido que inventarlo, que es exactamente lo que este fichero existe para
# impedir.
#
# Dentro del marco de longitud, la peticion es:
#
#   [u16 BE longitud_nombre][nombre][carga]
#
# Y la respuesta:
#
#   [u8 codigo][resto]
#
# El nombre va prefijado en longitud y no delimitado por un separador: un
# separador obliga a decidir que pasa si aparece dentro del nombre, y esa
# decision no deberia existir.

[peticion]
# Bytes del prefijo que declara la longitud del nombre de canal.
prefijo_nombre = 2
# Cota del nombre. Ningun identificador declarado se acerca, y la cota existe
# para que un prefijo absurdo no provoque una reserva absurda.
nombre_maximo = 64

[respuesta]
# Primer byte de la respuesta. El cero es la respuesta valida; el uno es un
# rechazo con motivo en texto.
#
# Se declaran los dos a proposito: un canal que responde bytes vacios ante un
# rechazo seria indistinguible de uno que responde una lista vacia.
codigo_respuesta = 0
codigo_rechazo = 1

[marco]
# Longitud maxima de un marco, en bytes. Acota el consumo del proceso principal
# ante un renderer comprometido (RPT-004 §6.2).
longitud_maxima = 1048576
# Prefijo de longitud en 4 bytes big-endian antes de cada carga util.
prefijo_longitud_bytes = 4

# ---------------------------------------------------------------------------
# CANALES PERMITIDOS
# ---------------------------------------------------------------------------
#
# La lista es de PERMITIDOS, no de bloqueados: un canal que no figure aqui se
# rechaza aunque el preload lo invoque (RPT-004 §6.2).

[[canal]]
nombre = "obtener-estado-agente"
vista = "VIS-04"
direccion = "consulta"
descripcion = "Estado resumido del demonio: version, perfil de segmento y vigencia de reglas."

[[canal]]
nombre = "obtener-inventario"
vista = "VIS-04"
direccion = "consulta"
descripcion = "Inventario vivo de dispositivos IoT/OT descubiertos y su postura."

[[canal]]
nombre = "obtener-estado-boveda"
vista = "VIS-04"
direccion = "consulta"
descripcion = "Ocupacion de la Boveda Aislada, para la alerta obligatoria de capacidad."

[[canal]]
nombre = "consultar-sandbox"
vista = "VIS-01"
direccion = "consulta"
descripcion = "Consulta SQL contra ALM-02. Nunca alcanza ALM-01 (RPT-002 §5)."

# RPT-019. Los dos canales de alerta son CONSULTAS, no empuje.
#
# Anadir empuje seria la respuesta obvia y es la equivocada: significa que el
# agente inicia comunicacion hacia el renderer, y eso es una CAPACIDAD nueva —no
# un mensaje nuevo— en la direccion que RPT-004 §6.2 restringe. Ademas obligaria
# a resolver entrega, orden y reintento sobre un transporte de peticion y
# respuesta, y no compraria lo que parece: si el renderer no esta abierto, la
# alerta se pierde igual. La durabilidad la da ALM-01, no el empuje.

[[canal]]
nombre = "consultar-alertas"
vista = "VIS-04"
direccion = "consulta"
descripcion = "Sucesos de alerta anexados a ALM-01, desde un numero de asiento."

[[canal]]
nombre = "obtener-condiciones"
vista = "VIS-04"
direccion = "consulta"
descripcion = "Estados degradados vigentes. A diferencia de las alertas, no se anexan: se consultan."

# ---------------------------------------------------------------------------
# CANALES PROHIBIDOS
# ---------------------------------------------------------------------------
#
# No son una lista de bloqueo —la autoridad es la lista de permitidos— sino
# pruebas de regresion. Si alguien introduce uno de estos nombres, las suites de
# ambos lados lo detectan y explican por que esta prohibido.

[[prohibido]]
nombre = "ordenar-contencion"
motivo = "La contencion se decide en guardian-cc a partir de telemetria real. Exponerla al renderer permitiria que la interfaz aislara nodos de una planta."

[[prohibido]]
nombre = "ejecutar-ddl-evidencia"
motivo = "ALM-01 es de solo anexado. Ninguna ruta de la interfaz puede emitir DDL contra el registro de evidencia (RPT-002 §5)."

[[prohibido]]
nombre = "invocar"
motivo = "Un pasamanos generico traslada la decision de autorizacion al renderer, que es justo la capa que no debe tenerla (RPT-004 §6.2)."

[[prohibido]]
nombre = "ejecutar-comando"
motivo = "Misma razon que 'invocar'."

# ---------------------------------------------------------------------------
# CARGA UTIL — PA-21
# ---------------------------------------------------------------------------
#
# La lista de permitidos blinda QUE canales existen. Esta seccion blinda QUE
# FORMA tienen sus mensajes, que es la siguiente capa donde ambos extremos
# pueden divergir.
#
# ASIMETRIA DEL FALLO. Los dos lados no fallan igual ante una forma inesperada:
#
#   Rust        serde con `deny_unknown_fields` RECHAZA ruidosamente. Un campo
#               ausente, sobrante o de tipo incorrecto es error de
#               deserializacion en la frontera.
#   TypeScript  accede a `respuesta.version`, obtiene `undefined` y el problema
#               aflora tres capas mas arriba, lejos de la causa.
#
# Por eso el rigor de Rust esta en el deserializador y el de TypeScript en la
# prueba de paridad: no hace falta el mismo mecanismo a ambos lados, hace falta
# el mecanismo adecuado en cada uno.
#
# VOCABULARIO DE TIPOS
#   texto              cadena UTF-8
#   entero             entero sin signo de 64 bits
#   booleano           verdadero o falso
#   enumerado          conjunto cerrado, valores separados por '|'
#   lista<T>           secuencia homogenea; admite anidamiento
#
# NOMBRES EN EL CABLE. Se usa camelCase porque el extremo TypeScript los consume
# tal cual. Rust los mapea con `#[serde(rename_all = "camelCase")]`.

