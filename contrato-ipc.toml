# Anadido en RPT-041 (PA-74). La respuesta era un array desnudo, y con la
# segmentacion de PA-59 paso a ser una vista parcial con apariencia de
# exhaustividad: quien pedia desde el cero recibia el segmento activo sin saber
# que habia asientos archivados antes.
#
# `primerDisponible` es lo mas antiguo que SOBREVIVE EN DISCO, no lo que este
# canal alcanza. Se lee del directorio en cada consulta y no se cachea: un valor
# cacheado seguiria diciendo 1 despues de que alguien borrara el segmento 1, que
# es justo el caso en el que la cifra importa.
[[registro]]
nombre = "RespuestaAlertas"

[[campo]]
registro = "RespuestaAlertas"
nombre = "primerDisponible"
tipo = "entero"

[[campo]]
registro = "RespuestaAlertas"
nombre = "sucesos"
tipo = "lista"

[[registro]]
nombre = "Condiciones"
descripcion = "Estados degradados vigentes. No son sucesos: son verdaderos hasta que alguien interviene."

[[campo]]
registro = "Condiciones"
nombre = "inventarioSuprimido"
tipo = "booleano"

[[campo]]
registro = "Condiciones"
nombre = "inventarioNoVerifica"
tipo = "booleano"

[[campo]]
registro = "Condiciones"
nombre = "observacionSaturada"
tipo = "booleano"

[[campo]]
registro = "Condiciones"
nombre = "capturaConPerdida"
tipo = "booleano"

# Anadido en RPT-047 (PA-81). El agente moria cuando la captura no podia
# abrirse, y se llevaba la escucha con el: el momento en que mas falta hace la
# consola era justo aquel en que el agente ya no estaba.
#
# No se reutiliza `capturaConPerdida`. Aquella dice «observo y se me escapan
# tramas»; esta dice que no hay observacion. Colapsarlas es como un operador
# concluye que en un segmento no paso nada, cuando nadie estaba mirando.
#
# El motivo —privilegios, interfaz inexistente, interfaz desaparecida— no viaja
# en la condicion: va en el asiento de ALM-01 que anota la transicion y en la
# linea de syslog, que es donde se diagnostica.
[[campo]]
registro = "Condiciones"
nombre = "capturaNoDisponible"
tipo = "booleano"

# Anadido en RPT-028 (PA-43). Al cablear los manejadores aparecio que DOS
# estados de arranque que exigen alerta no tenian por donde llegar al operador:
# `FormatoObsoleto` (RPT-022, actualizacion rutinaria que caduco el inventario)
# y `SinClaveAprovisionada` (RPT-024, instalacion a medias). Ninguno es un suceso
# —no ocurren, SON— y ninguno cabia en las cuatro condiciones anteriores.
#
# Es la distincion que la Fase 1 de PA-45 creo: `exige_alerta() &&
# !es_manipulacion()`. Se separa de las otras cuatro porque su remedio es una
# accion administrativa, no una respuesta a incidente, y mezclarlas produce la
# fatiga de alertas que aquel reporte existia para evitar.
[[campo]]
registro = "Condiciones"
nombre = "accionAdministrativa"
tipo = "booleano"

# Anadido en RPT-032 (PA-42). La alerta sale por syslog hacia el SIEM del
# cliente, y si el colector no responde hay que decirlo: un canal de alertas
# caido y uno silencioso son indistinguibles desde fuera (RPT-006 §4).
#
# ESTA CONDICION NO SE EMITE POR SYSLOG. Es la unica que no puede: emitirla
# exigiria el canal que acaba de fallar. Viaja solo por aqui.
[[campo]]
registro = "Condiciones"
nombre = "salidaNoDisponible"
tipo = "booleano"

# Anadido en RPT-039 (PA-72). `anexar` no comprobaba el techo del formato: al
# superar ASIENTOS_MAXIMOS se seguia anexando en memoria y el fichero resultante
# NO se podia releer, con lo que el arranque siguiente lo apartaba acusando de
# manipulacion a nadie.
#
# Es la unica condicion que significa "este sensor ya no registra amenazas". Las
# otras seis dicen que algo se ve peor; esta dice que la libreta se acabo.
[[campo]]
registro = "Condiciones"
nombre = "registroSaturado"
tipo = "booleano"

# Anadido en RPT-044 (PA-69). Una alerta anexada cuya escritura fallo existe y
# esta completa en memoria; lo que no esta es su durabilidad. `main.rs` lo
# imprimia y VIS-04 no tenia por donde enterarse.
#
# Se apaga sola cuando el disco vuelve, asi que NO basta: la constancia duradera
# es el asiento `persistencia-restablecida`, que se anexa al recuperar y describe
# el tramo entero.
[[campo]]
registro = "Condiciones"
nombre = "evidenciaEnRiesgo"
tipo = "booleano"

