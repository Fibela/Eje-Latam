nombre = "eventosPendientes"
tipo = "entero"

[[registro]]
nombre = "PeticionConsulta"
descripcion = "Consulta SQL dirigida al sandbox del analista (ALM-02)."

[[campo]]
registro = "PeticionConsulta"
nombre = "sentencia"
