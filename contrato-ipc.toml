# Anadido en RPT-041 (PA-74). La respuesta era un array desnudo, y con la
# segmentacion de PA-59 paso a ser una vista parcial con apariencia de
# exhaustividad: quien pedia desde el cero recibia el segmento activo sin saber
# que habia asientos archivados antes.
#
# `primerDisponible` es lo mas antiguo que SOBREVIVE EN DISCO, no lo que este
# canal alcanza. Se lee del directorio en cada consulta y no se cachea: un valor
# cacheado seguiria diciendo 1 despues de que alguien borrara el segmento 1, que
# es justo el caso en el que la cifra importa.
[[registro]]
nombre = "RespuestaAlertas"

[[campo]]
registro = "RespuestaAlertas"
nombre = "primerDisponible"
tipo = "entero"

# Anadido en RPT-049 (PA-96). `primerDisponible` cubria el lado antiguo —«lo de
# antes esta archivado»— y nadie cubria el nuevo: quien recibia 256 sucesos no
# tenia forma de saber si eran todos o el principio de dos mil.
#
# Acotar la respuesta sin decirlo convierte un rechazo ruidoso en una lista
# silenciosamente incompleta, que es peor: el operador la lee como el historico
# entero.
[[campo]]
registro = "RespuestaAlertas"
nombre = "hayMas"
tipo = "booleano"

[[campo]]
registro = "RespuestaAlertas"
nombre = "sucesos"
tipo = "lista"

[[registro]]
nombre = "Condiciones"
descripcion = "Estados degradados vigentes. No son sucesos: son verdaderos hasta que alguien interviene."

[[campo]]
registro = "Condiciones"
nombre = "inventarioSuprimido"
tipo = "booleano"

[[campo]]
registro = "Condiciones"
nombre = "inventarioNoVerifica"
tipo = "booleano"

[[campo]]
registro = "Condiciones"
nombre = "observacionSaturada"
tipo = "booleano"

[[campo]]
registro = "Condiciones"
nombre = "capturaConPerdida"
tipo = "booleano"

# Anadido en RPT-047 (PA-81). El agente moria cuando la captura no podia
# abrirse, y se llevaba la escucha con el: el momento en que mas falta hace la
# consola era justo aquel en que el agente ya no estaba.
#
# No se reutiliza `capturaConPerdida`. Aquella dice «observo y se me escapan
# tramas»; esta dice que no hay observacion. Colapsarlas es como un operador
# concluye que en un segmento no paso nada, cuando nadie estaba mirando.
#
# El motivo —privilegios, interfaz inexistente, interfaz desaparecida— no viaja
# en la condicion: va en el asiento de ALM-01 que anota la transicion y en la
# linea de syslog, que es donde se diagnostica.
[[campo]]
registro = "Condiciones"
nombre = "capturaNoDisponible"
tipo = "booleano"

# Anadido en RPT-028 (PA-43). Al cablear los manejadores aparecio que DOS
# estados de arranque que exigen alerta no tenian por donde llegar al operador:
# `FormatoObsoleto` (RPT-022, actualizacion rutinaria que caduco el inventario)
# y `SinClaveAprovisionada` (RPT-024, instalacion a medias). Ninguno es un suceso
# —no ocurren, SON— y ninguno cabia en las cuatro condiciones anteriores.
#
# Es la distincion que la Fase 1 de PA-45 creo: `exige_alerta() &&
# !es_manipulacion()`. Se separa de las otras cuatro porque su remedio es una
# accion administrativa, no una respuesta a incidente, y mezclarlas produce la
# fatiga de alertas que aquel reporte existia para evitar.
[[campo]]
registro = "Condiciones"
nombre = "accionAdministrativa"
tipo = "booleano"

# Anadido en RPT-032 (PA-42). La alerta sale por syslog hacia el SIEM del
# cliente, y si el colector no responde hay que decirlo: un canal de alertas
# caido y uno silencioso son indistinguibles desde fuera (RPT-006 §4).
#
# ESTA CONDICION NO SE EMITE POR SYSLOG. Es la unica que no puede: emitirla
# exigiria el canal que acaba de fallar. Viaja solo por aqui.
[[campo]]
registro = "Condiciones"
nombre = "salidaNoDisponible"
tipo = "booleano"

# Anadido en RPT-054 (PA-109). Distinta de la anterior y no por matiz: aquella
# dice que el colector existe y ahora no responde —una averia que se resuelve
# sola cuando la red vuelve—; esta dice que NUNCA hubo colector. No se arregla
# esperando: se configura.
#
# Colapsarlas mandaria al operador a investigar una caida de red inexistente, y
# al reves haria pasar una caida real por una instalacion a medias.
#
# ESTA CONDICION TAMPOCO SE EMITE POR SYSLOG, y es la segunda que no puede: un
# agente sin colector no puede avisar de que no tiene colector. El aviso viajaria
# por el canal que no existe. Ademas de aqui, la declaran el instalador y
# `journald`, que son los unicos sitios donde un sensor mudo puede decir algo.
[[campo]]
registro = "Condiciones"
nombre = "sinColector"
tipo = "booleano"

# Anadido en RPT-070 (PA-125). NO se dedujo: se observo ocurriendo. En systemd
# real, el conjunto acotado de capacidades impedia asignar el grupo al socket y
# el sensor arrancaba sin escucha local. Las diez condiciones de entonces decian,
# todas, que estaba sano (RPT-069 §4).
#
# ESTA CONDICION SI SE EMITE POR SYSLOG, y es lo que la distingue de las dos
# anteriores. Aquellas describen el canal de syslog mismo y por eso no pueden
# viajar por el; esta describe EL OTRO canal. Cuando la escucha local cae, syslog
# es justamente lo que sigue funcionando.
#
# Y es el unico camino posible: lo que podria contar que la consola no conecta es
# la consola, que es lo que no conecta.
[[campo]]
registro = "Condiciones"
nombre = "escuchaNoDisponible"
tipo = "booleano"

# Anadidas en RPT-074 (PA-79). Dos y no una, por lo mismo que inventarioSuprimido
# no es inventarioNoVerifica: «todavia no se ha aprovisionado» y «hay una y no
# vale» mandan al tecnico a sitios distintos.
#
# LAS DOS SE EMITEN. Describen el estado del sensor, no el canal de syslog.
#
# `configuracionSinFirmar` es un estado LEGITIMO de desarrollo y forense: el
# agente lanzado a mano es la herramienta con la que se observaron PA-123 y
# PA-125. Lo que no puede es pasar desapercibido, y por eso existe esta condicion
# en lugar de callar.
[[campo]]
registro = "Condiciones"
nombre = "configuracionSinFirmar"
tipo = "booleano"

# `configuracionNoVerifica` NO cuenta como manipulacion, aunque la firma rota
# apunte a ello: una configuracion emitida para otra maquina, una clave rotada o
# un fichero corrupto por disco dan lo mismo, y presentarlas como incidente
# mandaria al operador a respuesta a incidentes por un error de despliegue.
#
# Viaja con gravedad alta y sin acusar a nadie, como registroSaturado.
[[campo]]
registro = "Condiciones"
nombre = "configuracionNoVerifica"
tipo = "booleano"

# Anadido en RPT-039 (PA-72). `anexar` no comprobaba el techo del formato: al
# superar ASIENTOS_MAXIMOS se seguia anexando en memoria y el fichero resultante
# NO se podia releer, con lo que el arranque siguiente lo apartaba acusando de
# manipulacion a nadie.
#
# Es la unica condicion que significa "este sensor ya no registra amenazas". Las
# otras seis dicen que algo se ve peor; esta dice que la libreta se acabo.
[[campo]]
registro = "Condiciones"
nombre = "registroSaturado"
tipo = "booleano"

# Anadido en RPT-044 (PA-69). Una alerta anexada cuya escritura fallo existe y
# esta completa en memoria; lo que no esta es su durabilidad. `main.rs` lo
# imprimia y VIS-04 no tenia por donde enterarse.
#
# Se apaga sola cuando el disco vuelve, asi que NO basta: la constancia duradera
# es el asiento `persistencia-restablecida`, que se anexa al recuperar y describe
# el tramo entero.
[[campo]]
registro = "Condiciones"
nombre = "evidenciaEnRiesgo"
tipo = "booleano"

# --- Mensajes por canal ----------------------------------------------------
#
# Un canal sin peticion declarada no lleva carga util en esa direccion.

[[mensaje]]
canal = "obtener-estado-agente"
direccion = "respuesta"
forma = "EstadoAgente"

[[mensaje]]
canal = "obtener-inventario"
direccion = "respuesta"
forma = "lista<NodoInventario>"

[[mensaje]]
canal = "obtener-estado-boveda"
direccion = "respuesta"
forma = "EstadoBoveda"

[[mensaje]]
canal = "consultar-sandbox"
direccion = "peticion"
forma = "PeticionConsulta"

[[mensaje]]
canal = "consultar-sandbox"
direccion = "respuesta"
forma = "ResultadoConsulta"

[[mensaje]]
canal = "consultar-alertas"
direccion = "peticion"
forma = "PeticionAlertas"

# RPT-041 (PA-74): dejo de ser `lista<SucesoAlerta>`. Un array desnudo no puede
# decir donde empieza lo que entrega, y tras la segmentacion de PA-59 eso lo
# convirtio en una vista parcial con apariencia de exhaustividad.
[[mensaje]]
canal = "consultar-alertas"
direccion = "respuesta"
forma = "RespuestaAlertas"

[[mensaje]]
canal = "obtener-condiciones"
direccion = "respuesta"
forma = "Condiciones"
