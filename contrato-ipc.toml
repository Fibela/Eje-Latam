# Contrato IPC entre Eje-Visión y Eje-Agente.
#
# RPT-006. PA-20.
#
# ---------------------------------------------------------------------------
# POR QUE EXISTE ESTE FICHERO
# ---------------------------------------------------------------------------
#
# Rust y TypeScript no pueden compartir una definicion de tipos. Si cada lado
# declara los canales por su cuenta, divergen: es exactamente lo que ocurrio en
# este proyecto, donde `eje-vision` tenia su lista de canales y `eje-agente` no
# tenia ninguna.
#
# Este manifiesto es la UNICA FUENTE DE VERDAD. Ambos lados incluyen una prueba
# que lo lee y falla si su definicion local no coincide. La divergencia deja de
# ser posible en silencio: se convierte en CI en rojo.
#
# Es el mismo mecanismo que FUENTES.toml con su anclaje: declaracion unica mas
# comprobacion ejecutable en cada extremo.
#
# ---------------------------------------------------------------------------
# ANADIR UN CANAL
# ---------------------------------------------------------------------------
#
# Requiere tocar TRES sitios, y esa friccion es deliberada:
#   1. este fichero
#   2. `crates/eje-ipc/src/lib.rs`  (enum Canal)
#   3. `apps/eje-vision/packages/eje-vision-base/src/ipc/puente.ts`
#
# Un canal es una ampliacion de la superficie de ataque del proceso privilegiado.
# No debe poder anadirse sin que tres revisiones lo vean.

# ---------------------------------------------------------------------------
# FORMA DE LA PETICION Y DE LA RESPUESTA — RPT-035, PA-41
# ---------------------------------------------------------------------------
#
# Este bloque faltaba. El manifiesto declaraba QUE canales existen y QUE campos
# lleva cada carga, pero no COMO viaja el nombre del canal por el cable. Mientras
# no hubo transporte no se noto; al escribir el servicio, cada extremo habria
# tenido que inventarlo, que es exactamente lo que este fichero existe para
# impedir.
#
# Dentro del marco de longitud, la peticion es:
#
#   [u16 BE longitud_nombre][nombre][carga]
#
# Y la respuesta:
#
#   [u8 codigo][resto]
#
# El nombre va prefijado en longitud y no delimitado por un separador: un
# separador obliga a decidir que pasa si aparece dentro del nombre, y esa
# decision no deberia existir.

[peticion]
# Bytes del prefijo que declara la longitud del nombre de canal.
prefijo_nombre = 2
# Cota del nombre. Ningun identificador declarado se acerca, y la cota existe
# para que un prefijo absurdo no provoque una reserva absurda.
nombre_maximo = 64

[respuesta]
# Primer byte de la respuesta. El cero es la respuesta valida; el uno es un
# rechazo con motivo en texto.
#
# Se declaran los dos a proposito: un canal que responde bytes vacios ante un
# rechazo seria indistinguible de uno que responde una lista vacia.
codigo_respuesta = 0
codigo_rechazo = 1

[marco]
# Longitud maxima de un marco, en bytes. Acota el consumo del proceso principal
# ante un renderer comprometido (RPT-004 §6.2).
longitud_maxima = 1048576
# Prefijo de longitud en 4 bytes big-endian antes de cada carga util.
prefijo_longitud_bytes = 4

# ---------------------------------------------------------------------------
# DONDE SE ENCUENTRAN LOS DOS PROCESOS — RPT-079 §2.1, PA-132
# ---------------------------------------------------------------------------
#
# La ruta del socket vivio en TRES sitios y dos estaban mal. El agente abria
# /run/eje-latam/agente.sock desde RPT-067; la consola seguia llamando por
# omision a /run/eje/agente.sock, que quedo atras en aquel cambio; y los guiones
# de desarrollo usaban /tmp/eje/agente.sock.
#
# Con los valores de fabrica, un sensor sano y una consola sana NO se
# encontraban. Nadie lo vio porque los guiones pasan EJE_SOCKET a mano y eso
# tapaba el agujero: el defecto solo aparecia en un despliegue de verdad, que es
# donde no hay nadie mirando.
#
# Es el mismo argumento que los canales, un piso mas abajo. Un punto de
# encuentro es contrato entre los dos procesos: si cada lado lo declara por su
# cuenta, divergen. Que este aqui hace que la divergencia sea CI en rojo.

[socket]
# Directorio volatil donde nace el socket, por omision.
#
# systemd lo crea con RuntimeDirectory= y lo destruye al parar. /run es tmpfs:
# se vacia en cada arranque, con lo que el socket huerfano —el fichero que
# sobrevive al proceso y hace que el cliente reciba ECONNREFUSED sobre algo que
# existe— deja de ser posible por construccion (RPT-067, PA-120).
#
# El agente admite moverlo con --directorio-socket, para desarrollo sin
# privilegios. La consola lo admite con EJE_SOCKET. Lo que ninguno de los dos
# puede hacer es SUPONER uno distinto.
directorio = "/run/eje-latam"

# Nombre del fichero. NO es configurable en el agente, a proposito: se puede
# mover el directorio, nunca el fichero. Si la ruta completa fuera configurable,
# nada impediria apuntarla de vuelta al directorio de evidencia y deshacer la
# separacion de RPT-067 sin que ninguna comprobacion se enterase.
nombre = "agente.sock"

# ---------------------------------------------------------------------------
# CANALES PERMITIDOS
# ---------------------------------------------------------------------------
#
# La lista es de PERMITIDOS, no de bloqueados: un canal que no figure aqui se
# rechaza aunque el preload lo invoque (RPT-004 §6.2).
#
# ---------------------------------------------------------------------------
# `servido` — RPT-081, PA-135
# ---------------------------------------------------------------------------
#
# Estar declarado y estar cableado son cosas distintas, y hasta hoy el contrato
# solo sabia decir la primera. Cuatro de los seis canales no tenian manejador en
# el agente y NADA lo decia: la paridad afirmaba que los seis estaban declarados
# a los dos lados, que es verdad y no es lo que hace falta saber.
#
# `servido = false` NO es una promesa de desarrollo: es la declaracion de una
# ausencia, que es la doctrina de los tres estados (RPT-006 §4) aplicada al
# propio contrato. No es «existe» contra «no existe», sino:
#
#   servido = true    el agente responde
#   servido = false   declarado y sin manejador; se rechaza CON MOTIVO
#   no declarado      el guardian ni siquiera deja pasar la peticion
#
# Se prefirio esto a retirar los dos canales sin sustrato. Retirarlos habria
# dejado la lista mas corta y el defecto intacto: la comprobacion del agente
# llevaba una lista de dos ESCRITA A MANO dentro de la barrera que debia cubrir
# los seis. Ahora esa lista sale de aqui, y un canal nuevo sin manejador rompe
# la suite el mismo dia.

[[canal]]
nombre = "obtener-estado-agente"
vista = "VIS-04"
direccion = "consulta"
descripcion = "Estado resumido del demonio: version, perfil de segmento y si contendria por si solo."
servido = true
# `respuestaAutomatica` es la conjuncion de las DOS guardas que deciden de
# verdad: el perfil —`ot` nunca contiene solo— y el estado de arranque. La
# descripcion decia «vigencia de reglas» y prometia una tercera que nadie evalua:
# `boveda::VigenciaReglas` existe, esta probada y no la llama nadie (PA-137).
# Se corrige el texto en lugar de dejar que prometa lo que el campo no da.

[[canal]]
nombre = "obtener-inventario"
vista = "VIS-04"
direccion = "consulta"
descripcion = "Inventario vivo de dispositivos IoT/OT observados, con la evidencia de cada uno."
servido = false
motivo_no_servido = "Sin productor todavia (PA-138b). Enumerar ya se puede desde RPT-087: AlmacenObservacion::inventario() lista el volatil ordenado. Lo que falta es que exista que decir: de los cuatro campos de NodoInventario, clase cruza dos taxonomias distintas y postura no tiene valor para no-se-sabe. Los decide PA-139; rellenarlos antes seria inventar dato."

[[canal]]
nombre = "obtener-estado-boveda"
vista = "VIS-04"
direccion = "consulta"
descripcion = "Ocupacion de la Boveda Aislada, para la alerta obligatoria de capacidad."
servido = false
motivo_no_servido = "AGT-04, la Boveda Aislada, no existe todavia (PA-15). Sin subsistema detras, un manejador solo podria inventarse cifras."

[[canal]]
nombre = "consultar-sandbox"
vista = "VIS-01"
direccion = "consulta"
descripcion = "Consulta SQL contra ALM-02. Nunca alcanza ALM-01 (RPT-002 §5)."
servido = false
motivo_no_servido = "ALM-02, el sandbox del analista, no existe todavia (PA-18). El canal viaja y se rechaza con motivo; no se finge una consulta."

# RPT-019. Los dos canales de alerta son CONSULTAS, no empuje.
#
# Anadir empuje seria la respuesta obvia y es la equivocada: significa que el
# agente inicia comunicacion hacia el renderer, y eso es una CAPACIDAD nueva —no
# un mensaje nuevo— en la direccion que RPT-004 §6.2 restringe. Ademas obligaria
# a resolver entrega, orden y reintento sobre un transporte de peticion y
# respuesta, y no compraria lo que parece: si el renderer no esta abierto, la
# alerta se pierde igual. La durabilidad la da ALM-01, no el empuje.

[[canal]]
nombre = "consultar-alertas"
vista = "VIS-04"
direccion = "consulta"
descripcion = "Sucesos de alerta anexados a ALM-01, desde un numero de asiento."
servido = true

[[canal]]
nombre = "obtener-condiciones"
vista = "VIS-04"
direccion = "consulta"
descripcion = "Estados degradados vigentes. A diferencia de las alertas, no se anexan: se consultan."
servido = true

# ---------------------------------------------------------------------------
# CANALES PROHIBIDOS
# ---------------------------------------------------------------------------
#
# No son una lista de bloqueo —la autoridad es la lista de permitidos— sino
# pruebas de regresion. Si alguien introduce uno de estos nombres, las suites de
# ambos lados lo detectan y explican por que esta prohibido.

[[prohibido]]
nombre = "ordenar-contencion"
motivo = "La contencion se decide en guardian-cc a partir de telemetria real. Exponerla al renderer permitiria que la interfaz aislara nodos de una planta."

[[prohibido]]
nombre = "ejecutar-ddl-evidencia"
motivo = "ALM-01 es de solo anexado. Ninguna ruta de la interfaz puede emitir DDL contra el registro de evidencia (RPT-002 §5)."

[[prohibido]]
nombre = "invocar"
motivo = "Un pasamanos generico traslada la decision de autorizacion al renderer, que es justo la capa que no debe tenerla (RPT-004 §6.2)."

[[prohibido]]
nombre = "ejecutar-comando"
motivo = "Misma razon que 'invocar'."

# ---------------------------------------------------------------------------
# CARGA UTIL — PA-21
# ---------------------------------------------------------------------------
#
# La lista de permitidos blinda QUE canales existen. Esta seccion blinda QUE
# FORMA tienen sus mensajes, que es la siguiente capa donde ambos extremos
# pueden divergir.
#
# ASIMETRIA DEL FALLO. Los dos lados no fallan igual ante una forma inesperada:
#
#   Rust        serde con `deny_unknown_fields` RECHAZA ruidosamente. Un campo
#               ausente, sobrante o de tipo incorrecto es error de
#               deserializacion en la frontera.
#   TypeScript  accede a `respuesta.version`, obtiene `undefined` y el problema
#               aflora tres capas mas arriba, lejos de la causa.
#
# Por eso el rigor de Rust esta en el deserializador y el de TypeScript en la
# prueba de paridad: no hace falta el mismo mecanismo a ambos lados, hace falta
# el mecanismo adecuado en cada uno.
#
# VOCABULARIO DE TIPOS
#   texto              cadena UTF-8
#   entero             entero sin signo de 64 bits
#   booleano           verdadero o falso
#   enumerado          conjunto cerrado, valores separados por '|'
#   lista<T>           secuencia homogenea; admite anidamiento
#
# NOMBRES EN EL CABLE. Se usa camelCase porque el extremo TypeScript los consume
# tal cual. Rust los mapea con `#[serde(rename_all = "camelCase")]`.

# --- Registros -------------------------------------------------------------

[[registro]]
nombre = "EstadoAgente"
descripcion = "Estado resumido del demonio local."

[[campo]]
registro = "EstadoAgente"
nombre = "version"
tipo = "texto"

[[campo]]
registro = "EstadoAgente"
nombre = "perfil"
tipo = "enumerado"
valores = "corporativo|ot"

[[campo]]
registro = "EstadoAgente"
nombre = "respuestaAutomatica"
tipo = "booleano"

[[registro]]
nombre = "NodoInventario"
descripcion = "Dispositivo IoT/OT observado. Lleva EVIDENCIA, no juicios: el agente es testigo, VIS-04 es quien lee. RPT-088, PA-139."

# La clase y su PROCEDENCIA viajan en un solo valor a proposito.
#
# Separarlas en dos campos permitiria leer 'soporteVital' sin mirar de donde
# sale, y no es lo mismo que lo jure el administrador con su firma a que lo
# suponga el agente por haber visto trafico HL7. Bloquear un equipo inferido es
# gestion de red; bloquear uno declarado de soporte vital es riesgo humano.
#
# Cada valor es un resultado alcanzable de guardian_cc::clasificacion::clasificar,
# uno a uno. NO hay valores 'inferida*': cuando la huella sugiere criticidad sin
# marcado que la respalde, el dominio declara ambiguedad y NO afirma la clase.
# Una fuente inferida levanta la mano, no dictamina.
#
# 'declaradaNoCritica' es «no critico y hay un humano que lo firma», el unico
# estado que permite accion automatica. No es lo mismo que no saber nada.
[[campo]]
registro = "NodoInventario"
nombre = "direccionEnlace"
tipo = "texto"

[[campo]]
registro = "NodoInventario"
nombre = "clase"
tipo = "enumerado"
valores = "declaradaSoporteVital|declaradaSeguridadFuncional|declaradaCaminoDeGestion|declaradaNoCritica|segmentoDeclaradoSinCriticos|ambiguaMarcadoCaducado|ambiguaConflictoEntreFuentes|ambiguaInferenciaSugiereCriticidad|ambiguaSegmentoPuedeAlojarCriticos|indeterminada"

[[campo]]
registro = "NodoInventario"
nombre = "declaracionSegmento"
tipo = "enumerado"
valores = "sinDispositivosCriticos|puedeAlojarCriticos|noDeclarado"

# NO se llama 'marcaPegajosa' ni 'contenido'. Significa que se le vio en un
# segmento que admite criticos y que esa marca no se pierde por presion de
# tabla (RPT-018 §6). El agente NO contiene a nadie (RPT-020), y el nombre
# anterior invito a leerlo como contencion tres veces seguidas.
[[campo]]
registro = "NodoInventario"
nombre = "vistoEnSegmentoCritico"
tipo = "booleano"

[[campo]]
registro = "NodoInventario"
nombre = "protocolosObservados"
tipo = "lista<texto>"

[[campo]]
registro = "EstadoBoveda"
nombre = "usadoBytes"
tipo = "entero"

[[campo]]
