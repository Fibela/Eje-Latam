<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Eje-Visión — puesto de diagnóstico</title>
    <!--
      ESTO NO ES VIS-04.

      Es un puesto de diagnóstico para observar el puente IPC con los dos
      procesos vivos (RPT-046 §11, PA-82). Deliberadamente feo: si alguien lo
      confunde con el producto, el problema es que se parece demasiado.

      VIS-04 tiene diseño propio y no se improvisa aquí. Lo que esta página
      demuestra es que el camino renderer -> preload -> proceso principal ->
      socket -> agente funciona entero, sin privilegios elevados.

      Sin `<script>` en línea: la CSP de RPT-004 §6.1 no lleva 'unsafe-inline',
      así que el código va en un fichero aparte y eso es lo correcto.
    -->
    <style>
      body {
        font-family: ui-monospace, monospace;
        margin: 2rem;
        background: #101418;
        color: #d8dee4;
      }
      h1 { font-size: 1rem; font-weight: normal; color: #8b98a5; }
      .aviso { border: 1px solid #6b4; padding: .4rem .6rem; margin-bottom: 1.5rem; }
      table { border-collapse: collapse; }
      td { padding: .25rem .8rem .25rem 0; }
      .si { color: #f26; font-weight: bold; }
      .no { color: #4a8; }
      #error { color: #f80; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="aviso">
      Puesto de <b>diagnóstico</b>. No es la interfaz del producto.
    </div>
    <h1>Condiciones vigentes — <span id="sello">consultando…</span></h1>
    <table id="tabla"></table>
    <p id="error"></p>
    <script type="module" src="./diagnostico.js"></script>
  </body>
</html>
