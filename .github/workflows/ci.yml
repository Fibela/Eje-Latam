name: CI

# Verificaciones obligatorias de RPT-003 §9.4.
# Ninguna es opcional ni posponible.

on:
  push:
    branches: [Principal]
  pull_request:
    branches: [Principal]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  formato:
    name: Formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  analisis-estatico:
    name: Analisis estatico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy sin advertencias toleradas
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  pruebas:
    name: Pruebas (${{ matrix.so }})
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - name: Compilacion de release
        run: cargo build --workspace --release

  inconclusos:
    name: Implementaciones inconclusas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # El guardian vive en el crate `xtask`, no en un script de shell: corre
      # identico en Windows, Linux y CI, y se prueba con `cargo test`.
      # Sus propias pruebas se ejecutan en el job `pruebas` del workspace.
      - name: Bloquear todo!, mocks y endpoints sin implementar
        run: cargo xtask verificar crates

      # Un guardian que nunca falla no sirve. Se comprueba que detecta una
      # violacion deliberada antes de confiar en su veredicto.
      - name: El guardian detecta violaciones reales
        run: |
          mkdir -p /tmp/comprobacion/falso/src
          printf 'pub fn f() { todo!() }\n' > /tmp/comprobacion/falso/src/lib.rs
          if cargo xtask verificar /tmp/comprobacion; then
            echo "::error::El guardian NO detecto un todo!() deliberado. No protege nada."
            exit 1
          fi
          echo "El guardian detecta la violacion deliberada."

  indices:
    name: Indices derivados, no escritos a mano
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Tres indices de cosas que viven en el codigo. Los tres se quedaron atras
      # alguna vez, o se habrian quedado: el tablero conto 76 de 115 durante dos
      # semanas (PA-108), dos pruebas quedaron anidadas sin que nadie las
      # ejecutara (PA-73), y RPT-005 mandaba teclear una orden que no existe
      # (PA-119). Se derivan aqui para que ninguno dependa de que alguien se
      # acuerde.
      - name: Todo PA-nn citado en docs tiene fila en el tablero
        run: cargo xtask tablero

      - name: Toda prueba escrita se ejecuta
        run: cargo xtask cobertura

      - name: El manual de comandos y el binario dicen lo mismo
        run: cargo xtask manual

  secretos:
    name: Secretos expuestos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: un secreto borrado del arbol sigue en los commits.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    name: Licencias y vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny — frontera open-core y avisos
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # `licenses` es el control critico: impide que una dependencia copyleft
          # contamine un crate Apache-2.0 (RPT-003 §2.7 y §9.4).
          command: check advisories licenses bans sources

  inventario:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generar inventario de componentes
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"
          if-no-files-found: error
