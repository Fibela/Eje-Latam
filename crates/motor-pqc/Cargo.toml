[package]
name = "motor-pqc"
description = "Motor Poscuantico (AGT-02). Envoltorio hibrido ML-KEM / ML-DSA y cifrado AES-256-GCM en reposo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true
ml-kem = "0.3"
ml-dsa = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
hkdf = "0.12"
sha2 = "0.10"
rand_core = "0.10"

[lints]
workspace = true

[dev-dependencies]
libcrux-ml-kem = "0.0.10"
libcrux-ml-dsa = "0.0.10"
rand = "0.9"
serde_json = "1"
