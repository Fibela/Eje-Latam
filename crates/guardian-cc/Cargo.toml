[package]
name = "guardian-cc"
description = "Guardian de Confianza Cero (AGT-01). Inspeccion pasiva L2/L3 y contencion de nodos IoT/OT."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
# El inventario firmado reutiliza el Absorbedor y el arbol Merkle de ALM-01 en
# lugar de definir una codificacion canonica paralela (RPT-011 §2).
eje-almacen = { path = "../eje-almacen" }
# Verificacion hibrida de la raiz del inventario.
motor-pqc = { path = "../motor-pqc" }

[dev-dependencies]
# Misma version que motor-pqc. Alinearlas es deliberado: tres versiones de
# rand_core conviviendo ya nos costo una sesion.
rand_core = "0.10"

[lints]
workspace = true
